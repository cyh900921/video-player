<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Canvas Video Player</title>
<style>
  body {
    background:black; margin:0;
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    height:100vh;
  }
  canvas {
    background:black;
    max-width:100vw;
    max-height:80vh;
  }
  .controls {
    margin-top:20px;
    display:flex; gap:20px;
  }
  button {
    padding:20px 40px;
    font-size:24px;
    background:#444; color:white;
    border:none; border-radius:10px;
  }
  button:disabled {
    background:#222;
    color:#777;
  }
</style>
</head>

<body>

<video id="v" playsinline muted
  style="position:absolute; left:-9999px; top:-9999px; width:1px; height:1px;"
>
  <source src="赤潮+紅花石蒜.mp4" type="video/mp4">
</video>

<audio id="voice-over" src="audio.m4a"></audio>

<canvas id="c"></canvas>

<div class="controls">
  <button id="startBtn" onclick="startPlayback()">▶️ 開始播放</button>
  <button id="audioBtn" onclick="toggleAudio()">▶️ 語音導覽</button>
  <button onclick="exitPage()">❌ 離開</button>
</div>

<script>
const video = document.getElementById("v");
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const voiceOver = document.getElementById("voice-over");
const audioBtn = document.getElementById("audioBtn");

let playing = false;
let loopCount = 0;
const MAX_LOOP = 3;

const startBtn = document.getElementById("startBtn");

// ============================
// ⭐ 1) 載入後播放 0.1 秒抓第一幀
// ============================
video.addEventListener("loadedmetadata", () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  video.muted = true;
  video.currentTime = 0;

  video.play().then(() => {
    setTimeout(() => {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      video.pause();
      video.currentTime = 0;
    }, 120);
  });
});

// ============================
// ⭐ 播放循環
// ============================
function draw() {
  if (playing) {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    requestAnimationFrame(draw);
  }
}

video.addEventListener("ended", () => {
  loopCount++;
  if (loopCount < MAX_LOOP) {
    video.currentTime = 0;
    video.play();
  } else {
    playing = false;
    startBtn.textContent = "🔁 重複播放";
    startBtn.disabled = false;
  }
});

// ============================
// ⭐ 開始播放（按鈕觸發 → 有聲音）
// ============================
function startPlayback() {
  loopCount = 0;
  playing = true;

  video.muted = false;
  video.currentTime = 0;
  video.play();

  draw();

  startBtn.disabled = true;
}

// ============================
// ⭐ 語音導覽（用 Web Audio 放大音量）
// ============================
const VOICE_GAIN = 3.0; // 放大倍率（1.0 = 原始音量）
let audioCtx = null;

function boostVoice() {
  // 第一次播放時，把 <audio> 接到 GainNode 放大音量
  if (audioCtx) return;
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) return; // 瀏覽器不支援就維持原始音量
  audioCtx = new AudioCtx();
  const source = audioCtx.createMediaElementSource(voiceOver);
  const gainNode = audioCtx.createGain();
  gainNode.gain.value = VOICE_GAIN;
  source.connect(gainNode).connect(audioCtx.destination);
}

function toggleAudio() {
  boostVoice();
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();

  // 如果音檔正在播放，則暫停
  if (!voiceOver.paused) {
    voiceOver.pause();
    audioBtn.textContent = "▶️ 語音導覽";
  } else {
    // 否則 (已暫停或已結束)，從頭播放
    voiceOver.currentTime = 0;
    voiceOver.play();
    audioBtn.textContent = "⏸️ 暫停導覽";
  }
}

voiceOver.addEventListener("ended", () => {
  // 播放結束後，將按鈕文字恢復
  audioBtn.textContent = "▶️ 語音導覽";
});

// ============================
// ⭐ 離開按鈕
// ============================
function exitPage() {
  // 1. 試著關閉頁面（如果頁面是由 JS 打開的會成功）
  window.close();

  // 2. 如果關閉被阻擋 → 自動回上一頁（iPhone 會走這裡）
  setTimeout(() => {
    history.back();
  }, 50);
}
</script>

</body>
</html>
